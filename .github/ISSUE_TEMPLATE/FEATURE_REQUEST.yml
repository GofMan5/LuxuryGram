name: Feature request
description: Propose a focused improvement to LuxuryGram.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find the same request.
          required: true
        - label: The request is specific to a desktop client and does not require a Telegram server change.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem before proposing implementation details.
      placeholder: When I ..., I need ..., because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Explain the smallest useful behavior and where it belongs in the interface.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note existing settings, workarounds, or upstream behavior you evaluated.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: Visual references
      description: Optional mockups or examples. Remove private chat and account data before attaching images.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Platform constraints, accessibility needs, or compatibility considerations.
