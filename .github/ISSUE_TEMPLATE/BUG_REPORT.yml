name: Bug report
description: Report a reproducible LuxuryGram defect.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve LuxuryGram. Search existing issues first and remove private data from screenshots and logs.

        Security vulnerabilities must be reported privately through the Security tab, not this form.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed phone numbers, login codes, API credentials, session data, private messages, and other sensitive information.
          required: true
        - label: This is not an undisclosed security vulnerability.
          required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use the smallest reliable sequence.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: What happens instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: LuxuryGram commit or version
      description: Use the full commit SHA for self-built snapshots; do not write "latest".
      placeholder: 0123456789abcdef...
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: Include OS version, architecture, and desktop environment where relevant.
      placeholder: Windows 11 24H2 x64 / macOS 15 arm64 / Fedora 42 KDE
    validations:
      required: true

  - type: dropdown
    id: installation-source
    attributes:
      label: Installation source
      options:
        - Self-built from GofMan5/LuxuryGram
        - Official LuxuryGram release
        - Unofficial downstream package or build
    validations:
      required: true

  - type: dropdown
    id: upstream
    attributes:
      label: Does it reproduce upstream?
      description: Test only when practical.
      options:
        - Not tested
        - LuxuryGram only
        - AyuGram Desktop too
        - Telegram Desktop too
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Paste only the minimal relevant excerpt after removing private data.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anything else that materially helps reproduce the problem, including sanitized screenshots.
