[package]
name = "luxurygram-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
windows-host-smoke = []
bench-support = ["gpui/bench-support", "gpui_platform/bench-support"]

[dependencies]
design-tokens = { path = "../../crates/design-tokens" }
gpui = { package = "gpui-ce", version = "=0.3.0" }
gpui_platform = { package = "gpui_ce_platform", version = "=0.3.0" }
serde_json = "1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
gpui = { package = "gpui-ce", version = "=0.3.0", features = ["test-support"] }

[[bench]]
name = "message_list_scroll"
harness = false
required-features = ["bench-support"]
