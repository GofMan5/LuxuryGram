name: Release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing LuxuryGram tag to build, for example luxury-v1.0.0.'
        required: true
        type: string

permissions:
  contents: write

jobs:

  version:
    name: Resolve version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.resolve.outputs.version }}
      update: ${{ steps.resolve.outputs.update }}

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Resolve product version.
        id: resolve
        run: |
          TAG="${{ inputs.tag }}"
          case "$TAG" in
            luxury-v*) VERSION="${TAG#luxury-v}";;
            *) echo "Tag must look like luxury-v1.0.0, got $TAG." >&2; exit 1;;
          esac

          SOURCE=$(sed -n 's/^constexpr auto LuxuryVersionStr = "\(.*\)";$/\1/p' Telegram/SourceFiles/core/version.h)
          if [ "$VERSION" != "$SOURCE" ]; then
            echo "Tag $TAG claims $VERSION but LuxuryVersionStr is $SOURCE." >&2
            exit 1
          fi

          UPDATE=$(sed -n "s/^constexpr auto LuxuryUpdateVersion = \(.*\);$/\1/p" Telegram/SourceFiles/core/version.h | tr -d "'")
          EXPECTED=$(echo "$VERSION" | awk -F. '{ print $1 * 1000000 + $2 * 1000 + $3 }')
          if [ "$UPDATE" != "$EXPECTED" ]; then
            echo "LuxuryUpdateVersion is $UPDATE but version $VERSION expects $EXPECTED." >&2
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "update=$UPDATE" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (update counter $UPDATE)"

  windows-libraries:
    name: Windows x64 libraries
    needs: version
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          echo "Configurate git for cherry-picks."
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: Free runner disk space.
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files\Android',
            'C:\Program Files\Java',
            'C:\Program Files\LLVM',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files\MongoDB',
            'C:\Program Files\MySQL',
            'C:\Program Files\PostgreSQL',
            'C:\ghcup',
            'C:\hostedtoolcache\windows\CodeQL'
          )
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          "free_gib=$([math]::Round((Get-PSDrive C).Free / 1GB, 2))"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Libraries cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-release-libs-v1-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-release-libs-v1-
            ${{ runner.OS }}-x64-libs-v2-

      - name: Qt cache.
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-release-qt6-v1-${{ env.CACHE_KEY }}
          restore-keys: |
            ${{ runner.OS }}-x64-release-qt6-v1-
            ${{ runner.OS }}-x64-qt6-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

  windows:
    name: Windows x64
    needs: [version, windows-libraries]
    runs-on: windows-latest

    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
      VERSION: ${{ needs.version.outputs.version }}
      UPDATE_VERSION: ${{ needs.version.outputs.update }}

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: Update signing key.
        shell: bash
        env:
          UPDATE_KEY: ${{ secrets.LUXURY_UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "LUXURY_UPDATE_PRIVATE_KEY is not set: refusing to publish a release without signed updates." >&2
            exit 1
          fi
          python "$TBUILD/$REPO_NAME/Telegram/build/write_packer_private.py" "$TBUILD/$REPO_NAME/Telegram/SourceFiles/_other/packer_private.h"

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: Free runner disk space.
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files\Android',
            'C:\Program Files\Java',
            'C:\Program Files\LLVM',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files\MongoDB',
            'C:\Program Files\MySQL',
            'C:\Program Files\PostgreSQL',
            'C:\ghcup',
            'C:\hostedtoolcache\windows\CodeQL'
          )
          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          "free_gib=$([math]::Round((Get-PSDrive C).Free / 1GB, 2))"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-release-libs-v1-${{ env.CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-x64-release-qt6-v1-${{ env.CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Read build configuration.
        shell: bash
        run: |
          echo 'TDESKTOP_BUILD_GENERATOR=-G "Ninja Multi-Config"' >> $GITHUB_ENV
          echo "TDESKTOP_BUILD_API=-D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID || '611335' }} -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH || 'd524b414d21f4d37f08684c1df41ac9c' }}" >> $GITHUB_ENV

      - name: LuxuryGram build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          %TDESKTOP_BUILD_GENERATOR% ^
          qt6 ^
          %TDESKTOP_BUILD_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

          cmake --build ..\out --config Release --parallel

      - name: Sign update package.
        shell: pwsh
        run: |
          $out = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release"
          Push-Location $out
          & (Join-Path $out 'Packer.exe') -path LuxuryGram.exe -path Updater.exe -version $env:UPDATE_VERSION -target win64
          if ($LASTEXITCODE -ne 0) { throw "Packer failed with $LASTEXITCODE." }
          Pop-Location
          $package = Join-Path $out "tx64upd$env:UPDATE_VERSION"
          if (-not (Test-Path -LiteralPath $package)) { throw "Packer produced no $package." }
          Copy-Item -LiteralPath $package -Destination $env:GITHUB_WORKSPACE
          Get-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "tx64upd$env:UPDATE_VERSION") | Select-Object Name, Length

      - name: Package portable archive.
        shell: pwsh
        run: |
          $out = Join-Path $env:TBUILD "$env:REPO_NAME\out\Release"
          $stage = Join-Path $env:GITHUB_WORKSPACE 'package\LuxuryGram'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem -LiteralPath $out -File |
            Where-Object { $_.Extension -in '.exe', '.dll' } |
            Copy-Item -Destination $stage
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'LuxuryGram.exe'))) {
            throw "LuxuryGram.exe is missing in $out."
          }
          Get-ChildItem -LiteralPath $stage | Select-Object Name, Length
          Compress-Archive -Path $stage -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "LuxuryGram-$env:VERSION-win-x64-portable.zip")

      - uses: actions/upload-artifact@v7
        name: Upload portable archive.
        with:
          name: release-win-x64
          path: LuxuryGram-${{ needs.version.outputs.version }}-win-x64-portable.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        name: Upload update package.
        with:
          name: update-win-x64
          path: tx64upd${{ needs.version.outputs.update }}
          if-no-files-found: error

  linux:
    name: Linux x64
    needs: version
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: tdesktop:centos_env
      VERSION: ${{ needs.version.outputs.version }}
      UPDATE_VERSION: ${{ needs.version.outputs.update }}

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          submodules: recursive

      - name: Update signing key.
        env:
          UPDATE_KEY: ${{ secrets.LUXURY_UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo "LUXURY_UPDATE_PRIVATE_KEY is not set: refusing to publish a release without signed updates." >&2
            exit 1
          fi
          python3 Telegram/build/write_packer_private.py Telegram/SourceFiles/_other/packer_private.h

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          curl -sSL https://github.com/ccache/ccache/releases/download/v4.13.6/ccache-4.13.6-linux-x86_64-glibc.tar.xz \
          | sudo tar xJ -C /usr/local/bin --strip-components=1 ccache-4.13.6-linux-x86_64-glibc/ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/.tdesktop-cache" >> $GITHUB_ENV
          cd Telegram/build/docker/centos_env
          poetry install
          # ponytail: release libraries without LTO, same image the CI already proves; enable LTO only if binary size or speed is measured to need it.
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache

      - name: LuxuryGram build.
        run: |
          mkdir -p "$CCACHE_DIR"
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -v ${{ env.CCACHE_DIR }}:/var/cache/ccache \
          -e CONFIG=Release \
          -e CCACHE_SLOPPINESS=pch_defines,time_macros \
          $IMAGE_TAG \
          env -u CCACHE_DISABLE /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          -D TDESKTOP_API_ID=${{ secrets.TDESKTOP_API_ID || '611335' }} \
          -D TDESKTOP_API_HASH=${{ secrets.TDESKTOP_API_HASH || 'd524b414d21f4d37f08684c1df41ac9c' }} \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Sign update package.
        run: |
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -w /usr/src/tdesktop/out/Release \
          --entrypoint /usr/src/tdesktop/out/Release/Packer \
          $IMAGE_TAG \
          -path LuxuryGram -path Updater -version $UPDATE_VERSION
          test -f "out/Release/tlinuxupd$UPDATE_VERSION"
          mv "out/Release/tlinuxupd$UPDATE_VERSION" .
          ls -l "tlinuxupd$UPDATE_VERSION"

      - name: Package portable archive.
        run: |
          if [ ! -f out/Release/LuxuryGram ]; then
            echo "out/Release/LuxuryGram is missing." >&2
            exit 1
          fi
          mkdir -p package/LuxuryGram
          cp out/Release/LuxuryGram out/Release/Updater package/LuxuryGram/
          tar -C package -cJf "LuxuryGram-$VERSION-linux-x64.tar.xz" LuxuryGram
          ls -l "LuxuryGram-$VERSION-linux-x64.tar.xz"

      - uses: actions/upload-artifact@v7
        name: Upload portable archive.
        with:
          name: release-linux-x64
          path: LuxuryGram-${{ needs.version.outputs.version }}-linux-x64.tar.xz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        name: Upload update package.
        with:
          name: update-linux-x64
          path: tlinuxupd${{ needs.version.outputs.update }}
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [version, windows, linux]
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      UPDATE_VERSION: ${{ needs.version.outputs.update }}

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Download built archives.
        uses: actions/download-artifact@v7
        with:
          path: assets
          pattern: release-*
          merge-multiple: true

      - name: Download update packages.
        uses: actions/download-artifact@v7
        with:
          path: updates
          pattern: update-*
          merge-multiple: true

      - name: Checksums.
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes.
        run: |
          {
            awk -v version="$VERSION" '
              $0 == "## " version { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > section.md
            if [ ! -s section.md ]; then
              echo "CHANGELOG.md has no '## $VERSION' section." >&2
              exit 1
            fi
            cat section.md

            echo "## Downloads"
            echo
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            while read -r sum name; do
              echo "| \`${name#\*}\` | \`$sum\` |"
            done < <(grep -v 'SHA256SUMS.txt' assets/SHA256SUMS.txt)
            echo
            echo "Portable builds: unpack and run. Updates are delivered by the built-in updater from this repository, signed with the LuxuryGram update key."
            echo "Built with shared open Telegram API credentials, so sign-in can intermittently fail with a flood or API error; build from source with your own api_id and api_hash if you need reliable login."
            echo "The binaries are not code-signed, so Windows SmartScreen and macOS-style gatekeepers may warn on first launch."
            echo
            echo "Built from \`$TAG\` by workflow run [\`${{ github.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > notes.md
          cat notes.md

      - name: Update feed.
        run: |
          ls -l updates
          test -f "updates/tx64upd$UPDATE_VERSION"
          test -f "updates/tlinuxupd$UPDATE_VERSION"

          # AutoUpdateVersion() is 4 on Windows and on glibc 2.28 or newer.
          python3 Telegram/build/write_update_feed.py "$UPDATE_VERSION" assets/current4
          cat assets/current4
          (cd assets && sha256sum current4 >> SHA256SUMS.txt)

      - name: Publish update packages.
        run: |
          # Packages go live before the feed points at them; the feed is copied
          # over by hand once the draft release has been verified and published.
          if ! gh release view updates >/dev/null 2>&1; then
            gh release create updates --target "$(git rev-parse HEAD)" --latest=false \
              --title "LuxuryGram update feed" \
              --notes "Signed update packages and the feed the LuxuryGram updater polls. Not a downloadable release: see the Releases page for installable builds."
          fi
          gh release upload updates updates/* --clobber
          gh release view updates --json assets --jq '.assets[].name'

      - name: Create or update draft release.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "LuxuryGram $VERSION" --notes-file notes.md
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "LuxuryGram $VERSION" --notes-file notes.md assets/*
          fi
          gh release view "$TAG" --json isDraft,tagName,assets
